AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Tracehold local escalation Lambda

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x

Resources:
  EscalationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handler.handler
      Description: Escalates unresolved tickets after the demo-time SLA.
      Environment:
        Variables:
          DATABASE_URL: postgresql://tracehold:tracehold@host.docker.internal:35432/tracehold?schema=public
      Events:
        TraceholdEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt TraceholdEventsQueue.Arn
            BatchSize: 10
  TraceholdEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: tracehold-events

Outputs:
  EscalationFunction:
    Description: Escalation Lambda ARN
    Value: !GetAtt EscalationFunction.Arn
  TraceholdEventsQueueUrl:
    Description: Tracehold event queue URL
    Value: !Ref TraceholdEventsQueue
